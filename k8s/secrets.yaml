---
apiVersion: v1
kind: Secret
metadata:
  name: scrapecraft-secrets
  namespace: scrapecraft
  labels:
    app.kubernetes.io/name: scrapecraft
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Database credentials (base64 encoded)
  # IMPORTANT: Replace these with actual base64 encoded values from your secret management system
  # Generate with: echo -n "your-secure-password" | base64
  database-password: ""  # SET YOUR BASE64 ENCODED DATABASE PASSWORD
  
  # JWT Secret (base64 encoded)
  # Generate with: openssl rand -base64 32
  jwt-secret: ""  # SET YOUR BASE64 ENCODED JWT SECRET
  
  # LLM Provider API Keys (base64 encoded)
  # Set these in your secret management system and encode with base64
  openrouter-api-key: ""  # SET YOUR BASE64 ENCODED OPENROUTER API KEY
  google-api-key: ""     # SET YOUR BASE64 ENCODED GOOGLE API KEY
  bing-api-key: ""       # SET YOUR BASE64 ENCODED BING API KEY
  
  # External Service Credentials (base64 encoded)
  redis-password: ""     # SET YOUR BASE64 ENCODED REDIS PASSWORD
  
  # Encryption Keys (base64 encoded)
  # Generate with: openssl rand -base64 32
  encryption-key: ""     # SET YOUR BASE64 ENCODED ENCRYPTION KEY
  
stringData:
  # Configuration for secret management
  secret-management.md: |
    # OSINT-OS Secret Management Configuration
    
    ## Security Requirements
    - Never commit actual secrets to version control
    - Use external secret management (HashiCorp Vault, AWS Secrets Manager, etc.)
    - Rotate secrets regularly (every 90 days)
    - Use strong, randomly generated secrets
    
    ## Setup Instructions
    1. Generate secure secrets using the commands above
    2. Store secrets in your preferred secret management system
    3. Update this file with base64 encoded values
    4. Apply with: kubectl apply -f k8s/secrets.yaml
    
    ## Example Commands
    ```bash
    # Generate database password
    echo -n "$(openssl rand -base64 32)" | base64
    
    # Generate JWT secret
    openssl rand -base64 32 | base64
    
    # Generate encryption key
    openssl rand -base64 32 | base64
    ```
    
    ## Production Deployment
    - Integrate with CI/CD pipeline for automatic secret injection
    - Implement secret rotation policies
    - Monitor secret access and usage
    - Use role-based access control for secret management
